modparam("acc", "detect_direction", 1)
modparam("acc", "db_url", "mysql://sbc_user:Secret_SBC_2026!@127.0.0.1/sbc_sip_i")
modparam("acc", "db_flag", 1)
modparam("acc", "db_missed_flag", 2)
modparam("acc", "db_table_acc", "cdrs")

# ----------------- Parâmetros de RTPEngine -----------------
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")

# ----------------- Parâmetros do Dispatcher (Operadoras Oi, Claro, Vivo, TIM) -----------------
modparam("dispatcher", "db_url", "mysql://sbc_user:Secret_SBC_2026!@127.0.0.1/sbc_sip_i")
modparam("dispatcher", "table_name", "sipi_trunks")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "dst_avp", "$avp(AVP_DST)")
modparam("dispatcher", "grp_avp", "$avp(AVP_GRP)")
modparam("dispatcher", "cnt_avp", "$avp(AVP_CNT)")
modparam("dispatcher", "ds_ping_interval", 15)
modparam("dispatcher", "ds_probing_threshold", 2)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=404;code=480;code=486")

####### Routing Logic ########
request_route {
    # Sanity checks
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_ERR", "Mensagem malformada descartada\n");
        exit;
    }

    # Tratamento de retransmissões
    if (t_check_trans()) {
        t_check_trans();
        exit;
    }

    # Tratamento de CANCEL e BYE
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            rtpengine_delete();
            t_relay();
        }
        exit;
    }

    if (is_method("BYE")) {
        setflag(1); # ACC accounting
        rtpengine_delete();
        t_relay();
        exit;
    }

    # Respostas para OPTIONS (Keepalive das operadoras)
    if (is_method("OPTIONS") && uri==myself) {
        sl_send_reply("200", "Kamailio SBC SIP-i Active");
        exit;
    }

    # Tratamento de INVITE (Sessão de chamada)
    if (is_method("INVITE")) {
        setflag(1); # Flag para gravação de CDR no MariaDB

        # Detecção de encapsulamento SIP-i (MIME multipart application/isup)
        if (search_body("^Content-Type:.*application/isup")) {
            xlog("L_INFO", "[SIP-i] Chamada com encapsulamento ISUP Q.1912.5 detectada para $rU\n");
        }

        # Alocação de mídia no RTPEngine
        rtpengine_manage("replace-origin replace-session-connection ICE=remove RTP/AVP");

        # Roteamento pelo Dispatcher para tronco da operadora
        if (!ds_select_dst("1", "4")) {
            sl_send_reply("503", "Nenhum Tronco de Operadora Disponivel");
            exit;
        }

        record_route();
        t_on_reply("MANAGE_REPLY");
        t_on_failure("MANAGE_FAILURE");

        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    t_relay();
}

onreply_route[MANAGE_REPLY] {
    if (status =~ "[12][0-9][0-9]") {
        rtpengine_manage("replace-origin replace-session-connection");
    }
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }

    # Failover de rota pelo Dispatcher se tronco retornar erro
    if (t_check_status("503|500|408")) {
        if (ds_next_dst()) {
            t_on_failure("MANAGE_FAILURE");
            t_relay();
            exit;
        }
    }
}
